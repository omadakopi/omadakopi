<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Digital - Omada Coffe</title>
    <!-- CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi Transisi Slide Modal dari Bawah */
        .modal-enter {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-enter-active {
            transform: translateY(0);
        }
        /* Hide scrollbar untuk filter horizontal */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-28 min-h-screen">

    <!-- Hero Header dengan Warna Utama #8c0307 -->
    <header class="bg-[#8c0307] text-white py-6 px-4 text-center shadow-md">
    <div class="max-w-md mx-auto flex flex-col items-center justify-center">
        
        <!-- Logo Omada Kopi -->
        <img src="logo.png" 
             alt="Logo Omada Kopi" 
             class="w-20 h-20 md:w-24 md:h-24 object-contain rounded-full bg-white p-1 shadow-md mb-3 border-2 border-white/20">

        <!-- Judul & Subtitle -->
        <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight">Omada Kopi</h1>
        <p class="mt-1 text-red-100 text-xs md:text-sm">Pilih menu favorit Anda dan pesan secara instan langsung dari meja!</p>
    </div>
	</header>

    <!-- Navigation Filter Kategori -->
    <nav class="sticky top-0 bg-white/90 backdrop-blur-md shadow-sm z-10 py-3 px-4 mb-6">
        <div class="max-w-md mx-auto flex justify-start sm:justify-center gap-2 overflow-x-auto no-scrollbar text-sm">
            <button onclick="filterMenu('semua')" class="btn-filter bg-[#8c0307] text-white px-4 py-2 rounded-full transition font-medium text-xs whitespace-nowrap shadow-sm">Semua</button>
            <button onclick="filterMenu('makanan')" class="btn-filter bg-slate-100 text-slate-700 px-4 py-2 rounded-full transition hover:bg-slate-200 font-medium text-xs whitespace-nowrap">Makanan</button>
            <button onclick="filterMenu('minuman')" class="btn-filter bg-slate-100 text-slate-700 px-4 py-2 rounded-full transition hover:bg-slate-200 font-medium text-xs whitespace-nowrap">Minuman</button>
            <button onclick="filterMenu('camilan')" class="btn-filter bg-slate-100 text-slate-700 px-4 py-2 rounded-full transition hover:bg-slate-200 font-medium text-xs whitespace-nowrap">Camilan</button>
        </div>
    </nav>

    <!-- Container Menu Grid -->
    <main class="max-w-4xl mx-auto px-4">
        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Item menu akan dirender secara dinamis melalui JavaScript -->
        </div>
    </main>

    <!-- Floating Cart Bar (Melayang di Bawah Layar) -->
    <div id="cart-bar" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900/95 backdrop-blur-md text-white rounded-2xl p-4 shadow-2xl flex items-center justify-between hidden z-20 transition-all border border-slate-800">
        <div>
            <p class="text-xs text-slate-400"><span id="cart-count" class="font-bold text-white">0</span> Item Dipilih</p>
            <p class="text-lg font-bold text-red-400" id="cart-total">Rp 0</p>
        </div>
        <button onclick="bukaModalKeranjang()" class="bg-[#8c0307] hover:bg-[#6e0205] text-white font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm transition flex items-center gap-2 shadow-lg">
            🛒 Lihat Pesanan
        </button>
    </div>

    <!-- Modal Keranjang Pemesanan (Pop-up Bottom Sheet) -->
    <div id="cart-modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 hidden opacity-0 transition-opacity duration-300" onclick="tutupModalKeranjang()"></div>
    
    <div id="cart-modal" class="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-white rounded-t-3xl shadow-2xl z-40 hidden modal-enter flex flex-col max-h-[90vh]">
        
        <!-- Modal Header -->
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
            <h2 class="font-bold text-base text-slate-800 flex items-center gap-2">
                🛒 Keranjang Pesanan
            </h2>
            <button onclick="tutupModalKeranjang()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center font-bold hover:bg-slate-200">✕</button>
        </div>

        <!-- Detail Form & Daftar Pesanan (Scrollable) -->
        <div class="p-4 overflow-y-auto space-y-4">
            
            <!-- Form Identitas Pelanggan -->
            <div class="space-y-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nomor Meja <span class="text-red-500">*</span></label>
                    <input type="text" id="no-meja" placeholder="Contoh: Meja 05" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#8c0307] bg-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Pemesan <span class="text-red-500">*</span></label>
                    <input type="text" id="nama-pemesan" placeholder="Nama Anda" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#8c0307] bg-white">
                </div>
            </div>

            <!-- List Item di Keranjang -->
            <div>
                <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Rincian Item & Catatan</h3>
                <div id="modal-cart-items" class="space-y-3">
                    <!-- Item keranjang dirender dinamis di sini -->
                </div>
            </div>

            <!-- Pilih Metode Pembayaran -->
            <div>
                <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Metode Pembayaran</h3>
                <select id="metode-bayar" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-[#8c0307]">
                    <option value="QRIS / E-Wallet">QRIS / E-Wallet (Gopay/OVO/Dana)</option>
                    <option value="Tunai di Kasir">Bayar Tunai di Kasir</option>
                    <option value="Debit / Kartu Kredit">Kartu Debit / Kredit</option>
                </select>
            </div>
        </div>

        <!-- Modal Footer (Total & Tombol Kirim) -->
        <div class="p-4 border-t border-slate-100 bg-slate-50 rounded-b-3xl">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-semibold text-slate-600">Total Pembayaran:</span>

                📱 Kirim Pesanan via WhatsApp
            </button>
        </div>
    </div>

			{ id: 32, nama: "Mix Platter", kategori: "camilan", harga: 15000, deskripsi: "Espresso espresso pilihan dipadukan dengan susu segar dan gula aren asli.", gambar: "https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=400&q=80" },
			{ id: 33, nama: "Tahu Walik", kategori: "camilan", harga: 13000, deskripsi: "Espresso espresso pilihan dipadukan dengan susu segar dan gula aren asli.", gambar: "https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=400&q=80" },
			{ id: 34, nama: "Pangsit", kategori: "camilan", harga: 13000, deskripsi: "Espresso espresso pilihan dipadukan dengan susu segar dan gula aren asli.", gambar: "https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=400&q=80" },
			{ id: 35, nama: "Mendoan", kategori: "camilan", harga: 10000, deskripsi: "Espresso espresso pilihan dipadukan dengan susu segar dan gula aren asli.", gambar: "https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=400&q=80" }
        ];

        // State Penyimpanan Keranjang & Catatan
        let keranjang = {};
        let catatanMenu = {};

        // Render Menu Utama
        function renderMenu(items) {
            const grid = document.getElementById("menu-grid");
            grid.innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition border border-slate-100 flex flex-col justify-between">
                    <div>
                        <img src="${item.gambar}" alt="${item.nama}" class="w-full h-40 object-cover" loading="lazy">
                        <div class="p-4">
                            <span class="text-[10px] font-bold tracking-wider uppercase bg-red-50 text-[#8c0307] px-2 py-0.5 rounded-md">${item.kategori}</span>
                            <h3 class="font-bold text-slate-800 text-sm md:text-base mt-2">${item.nama}</h3>
                            <p class="text-slate-500 text-xs mt-1 leading-relaxed">${item.deskripsi}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 flex items-center justify-between mt-2">
                        <span class="font-bold text-[#8c0307] text-sm">Rp ${item.harga.toLocaleString('id-ID')}</span>
                        <div class="flex items-center gap-2">
                            <button onclick="tambahItem(${item.id}, -1)" class="w-7 h-7 bg-slate-100 rounded-lg text-slate-600 font-bold hover:bg-slate-200 transition text-sm flex items-center justify-center">-</button>
                            <span id="qty-${item.id}" class="text-xs font-bold w-4 text-center">0</span>
                            <button onclick="tambahItem(${item.id}, 1)" class="w-7 h-7 bg-[#8c0307] hover:bg-[#6e0205] rounded-lg text-white font-bold transition text-sm flex items-center justify-center">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            // Sinkronkan jumlah kuantitas jika filter diubah
            Object.keys(keranjang).forEach(id => {
                const el = document.getElementById(`qty-${id}`);
                if (el) el.innerText = keranjang[id];
            });
        }

        // Filter Kategori
        function filterMenu(kategori) {
            const buttons = document.querySelectorAll('.btn-filter');
            buttons.forEach(btn => {
                btn.classList.remove('bg-[#8c0307]', 'text-white', 'shadow-sm');
                btn.classList.add('bg-slate-100', 'text-slate-700');
            });
            event.target.classList.remove('bg-slate-100', 'text-slate-700');
            event.target.classList.add('bg-[#8c0307]', 'text-white', 'shadow-sm');

            if (kategori === 'semua') {
                renderMenu(dataMenu);
            } else {
                renderMenu(dataMenu.filter(item => item.kategori === kategori));
            }
        }

        // Tambah / Kurangi Kuantitas Item
        function tambahItem(id, change) {
            if (!keranjang[id]) keranjang[id] = 0;
            keranjang[id] += change;

            if (keranjang[id] <= 0) {
                delete keranjang[id];
                delete catatanMenu[id];
            }

            const qtyEl = document.getElementById(`qty-${id}`);
            if (qtyEl) qtyEl.innerText = keranjang[id] || 0;

            updateCartBar();
            renderModalItems();
        }

        // Simpan Catatan Item
        function simpanCatatan(id, text) {
            catatanMenu[id] = text;
        }

        // Update Floating Cart Bar
        function updateCartBar() {
            const totalCount = Object.values(keranjang).reduce((a, b) => a + b, 0);
            const totalPrice = Object.entries(keranjang).reduce((sum, [id, qty]) => {
                const item = dataMenu.find(m => m.id === parseInt(id));
                return sum + (item ? item.harga * qty : 0);
            }, 0);

            const cartBar = document.getElementById("cart-bar");
            if (totalCount > 0) {
                cartBar.classList.remove("hidden");
                document.getElementById("cart-count").innerText = totalCount;
                document.getElementById("cart-total").innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
                document.getElementById("modal-total-price").innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
            } else {
                cartBar.classList.add("hidden");
                tutupModalKeranjang();
            }
        }

        // Render Rincian Item di Dalam Modal Keranjang
        function renderModalItems() {
            const container = document.getElementById("modal-cart-items");
            const entries = Object.entries(keranjang);

            if (entries.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-400 py-4">Keranjang Anda masih kosong.</p>`;
                return;
            }

            container.innerHTML = entries.map(([id, qty]) => {
                const item = dataMenu.find(m => m.id === parseInt(id));
                if (!item) return '';
                const subtotal = item.harga * qty;
                const noteVal = catatanMenu[id] || '';

                return `
                    <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm space-y-2">
                        <div class="flex items-center justify-between">
                            <div class="flex-1 pr-2">
                                <h4 class="font-bold text-slate-800 text-xs">${item.nama}</h4>
                                <p class="text-[11px] text-slate-400">Rp ${item.harga.toLocaleString('id-ID')} x ${qty}</p>
                                <p class="text-xs font-bold text-[#8c0307] mt-0.5">Rp ${subtotal.toLocaleString('id-ID')}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="tambahItem(${item.id}, -1)" class="w-6 h-6 bg-slate-100 rounded text-slate-600 font-bold hover:bg-slate-200 text-xs flex items-center justify-center">-</button>
                                <span class="text-xs font-bold w-4 text-center">${qty}</span>
                                <button onclick="tambahItem(${item.id}, 1)" class="w-6 h-6 bg-[#8c0307] rounded text-white font-bold hover:bg-[#6e0205] text-xs flex items-center justify-center">+</button>
                            </div>
                        </div>
                        <input type="text" 
                               value="${noteVal}" 
                               onchange="simpanCatatan(${item.id}, this.value)"
                               placeholder="Catatan (misal: Less sugar, pedas)" 
                               class="w-full text-[11px] p-2 rounded-lg bg-slate-50 border border-slate-200 focus:outline-none focus:ring-1 focus:ring-[#8c0307]">
                    </div>
                `;
            }).join('');
        }

        // Modal Controls
        function bukaModalKeranjang() {
            renderModalItems();
            const backdrop = document.getElementById("cart-modal-backdrop");
            const modal = document.getElementById("cart-modal");

            backdrop.classList.remove("hidden");
            modal.classList.remove("hidden");

            setTimeout(() => {
                backdrop.classList.add("opacity-100");
                modal.classList.add("modal-enter-active");
            }, 10);
        }

        function tutupModalKeranjang() {
            const backdrop = document.getElementById("cart-modal-backdrop");
            const modal = document.getElementById("cart-modal");

            backdrop.classList.remove("opacity-100");
            modal.classList.remove("modal-enter-active");

            setTimeout(() => {
                backdrop.classList.add("hidden");
                modal.classList.add("hidden");
            }, 300);
        }

        // Kirim Pesanan Format Terstruktur ke WhatsApp
        function kirimPesananWhatsApp() {
            const noMeja = document.getElementById("no-meja").value.trim();
            const namaPemesan = document.getElementById("nama-pemesan").value.trim();
            const metodeBayar = document.getElementById("metode-bayar").value;

            if (!noMeja || !namaPemesan) {
                alert("Harap lengkapi Nomor Meja dan Nama Pemesan!");
                return;
            }

            let pesan = `Halo Kasir, saya ingin memesan:\n\n`;
            pesan += `👤 *Nama:* ${namaPemesan}\n`;
            pesan += `🪑 *Nomor Meja:* ${noMeja}\n`;
            pesan += `💳 *Pembayaran:* ${metodeBayar}\n\n`;
            pesan += `📋 *Rincian Pesanan:*\n`;

            let total = 0;
            Object.entries(keranjang).forEach(([id, qty]) => {
                const item = dataMenu.find(m => m.id === parseInt(id));
                if (item) {
                    const subtotal = item.harga * qty;
                    total += subtotal;
                    const catatan = catatanMenu[id] ? ` _(Note: ${catatanMenu[id]})_` : '';
                    pesan += `- *${item.nama}* (${qty}x) = Rp ${subtotal.toLocaleString('id-ID')}${catatan}\n`;
                }
            });

            pesan += `\n💰 *Total Pembayaran:* Rp ${total.toLocaleString('id-ID')}\n\n`;
            pesan += `Mohon segera diproses. Terima kasih!`;

            const urlWA = `https://wa.me/${NOMOR_WHATSAPP}?text=${encodeURIComponent(pesan)}`;
            window.open(urlWA, '_blank');
        }

        // Inisialisasi awal
        renderMenu(dataMenu);
    </script>
</body>
</html>
